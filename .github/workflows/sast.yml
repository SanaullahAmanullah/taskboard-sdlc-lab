name: SAST

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep — Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-expires \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-secure \
            --error \
            .
