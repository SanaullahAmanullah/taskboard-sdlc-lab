name: SAST

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep — Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # Cookie rule exclusions (lab environment):
        # - no-expires: maxAge is set instead (equivalent)
        # - no-secure: conditional on NODE_ENV (secure in production)
        # - no-domain: unset for localhost (set COOKIE_DOMAIN in production)
        run: |
          semgrep scan \
            --config p/javascript \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-expires \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-secure \
            --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-domain \
            --error \
            .
